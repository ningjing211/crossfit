@if (state() === 'loading') {
  <cf-loading message="正在讀取課表" />
} @else if (state() === 'error') {
  <cf-error (retry)="retry()" />
} @else if (state() === 'missing') {
  <p>找不到這堂課</p>
  <a routerLink="/">課程</a>
} @else if (session(); as current) {
  <cf-class-detail [session]="current" [media]="media()" />
}
