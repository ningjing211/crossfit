@if (state() === 'loading') {
  <cf-loading message="正在讀取動作" />
} @else if (state() === 'error') {
  <cf-error (retry)="retry()" />
} @else if (state() === 'missing') {
  <p>找不到這個動作</p>
  <a routerLink="/movements">動作</a>
} @else if (movement(); as current) {
  <cf-movement-detail [movement]="current" [imageUrl]="imageUrl()" [videoUrl]="videoUrl()" />
}
